name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Linux launcher
        run: |
          test -x runstupidbot.sh
          sh -n runstupidbot.sh

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Check lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: File checks
        run: uv run --no-sync prek run --all-files --group files

      - name: Ruff format
        run: uv run --no-sync ruff format --check .

      - name: Ruff lint
        run: uv run --no-sync ruff check --output-format=github .

      - name: Project checks
        run: uv run --no-sync prek run --all-files --stage pre-push --group verify

  profile-native:
    name: profile native smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"

      - name: Install native renderer
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y inkscape
          inkscape --version

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Native profile smoke
        env:
          VOICE_PROFILE_NATIVE: '1'
        run: uv run --no-sync pytest -q tests/cogs/voice/profile/test_native.py
